<!DOCTYPE html>
<html lang="ru">

    <meta charset="UTF-8">

    <title>CodeUse | SF</title>

    <link rel="icon" href="images/favicon-mascot.svg" type="image/svg+xml">
    <link rel="icon" href="images/favicon-mascot-32.png" type="image/png" sizes="32x32">

    <link rel="preconnect" href="https://fonts.googleapis.com">

        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300..800;1,14..32,300..800&display=swap"

    <script>
        // Применяем сохранённую тему до первой отрисовки, чтобы не было вспышки.
        (function () {
            var t = localStorage.getItem('theme');
            if (t === 'light' || t === 'dark') {
                document.documentElement.setAttribute('data-theme', t);
            }
        })();
    </script>
</head>

    <div class="shell">

        <header class="topbar">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true"></span>
                <span class="brand-name">CodeUse</span>
                <span class="brand-sf">SF</span>
            </div>
            <div class="theme-switch" role="group" aria-label="Тема оформления">                <button type="button" class="theme-btn" data-theme-choice="system" title="Как в системе"
                    aria-label="Системная тема" aria-pressed="false">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <rect x="2" y="3" width="20" height="14" rx="2" stroke="currentColor" stroke-width="1.8" />
                        <path d="M8 21h8M12 17v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                    </svg>
                </button>
                <button type="button" class="theme-btn" data-theme-choice="light" title="Светлая"
                    aria-label="Светлая тема" aria-pressed="false">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8" />
                        <path
                            d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"
                            stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                    </svg>
                </button>
                <button type="button" class="theme-btn" data-theme-choice="dark" title="Тёмная"
                    aria-label="Тёмная тема" aria-pressed="false">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" stroke="currentColor" stroke-width="1.8"
                            stroke-linejoin="round" />
                    </svg>
                </button>
            </div>
        </header>

        <div class="frame">

            <aside class="rail">
                <div class="rail-group">
                    <h2 class="rail-title">01 · Форматирование</h2>

                    <div class="switch-row">
                        <input type="checkbox" data-checkbox="main" id="cb-main" class="styled-checkbox" checked>
                        <label class="switch-label" for="cb-main">Обернуть код в <span
                                class="text-strong-code">main-block</span></label>
                    </div>

                    <!-- Скрыл чекбокс который оборачивал формулу в \(\) #формула
                    <div class="switch-row">
                        <input type="checkbox" data-checkbox="add_formulas" id="cb-add_formulas" class="styled-checkbox" checked>
                        <label class="switch-label" for="cb-add_formulas">Добавить обертку <span class="text-strong-code">\(\)</span> под формулу</label>
                    </div>
                    -->

                    <div class="switch-row">
                        <input type="checkbox" data-checkbox="formulas_replace" id="cb-formulas_replace"
                            class="styled-checkbox" checked>
                        <label class="switch-label" for="cb-formulas_replace">Заменить <span
                                class="text-strong-code">$$</span> на <span class="text-strong-code">\(\)</span> в
                            формулах</label>
                    </div>

                    <div class="switch-row switch-row--select">
                        <label class="switch-label" for="pre-language-select">Язык для <span
                                class="text-strong-code">&lt;pre class=...&gt;</span></label>
                        <select class="select" data-select="pre-language" id="pre-language-select">
                            <option value="python">Python</option>
                            <option value="java">Java</option>
                            <option value="javascript">JS</option>
                            <option value="cpp">C++</option>
                            <option value="csharp">C#</option>
                            <option value="justc">C</option>
                            <option value="php">PHP</option>
                            <option value="markup">HTML</option>
                            <option value="notxexe">Default</option>
                        </select>
                    </div>

                    <div class="switch-row">
                        <input type="checkbox" data-checkbox="span-div" id="cb-span-div" class="styled-checkbox"
                            checked>
                        <label class="switch-label" for="cb-span-div">Заменить <span
                                class="text-strong-code">&lt;span&gt;</span> на <span
                                class="text-strong-code">&lt;div&gt;</span> [imp|biblio]</label>
                    </div>
                </div>

                <div class="rail-group">
                    <h2 class="rail-title">02 · Удаление</h2>

                    <div class="switch-row">
                        <input type="checkbox" data-checkbox="deleteDiv" id="cb-deleteDiv" class="styled-checkbox"

                    <div class="switch-row">

                    <textarea id="outputText" readonly spellcheck="false"></textarea>

            let rafId = null;
            let running = false;
            let isOpen = false;
            let drops = [];
            let cells = [];
            let startAt = 0;
            let finished = false;
            let currentName = '';
            let lastIdx = -1;

            function pickSprite() {
                let i;
                do {
                    i = Math.floor(Math.random() * SPRITES.length);
                } while (SPRITES.length > 1 && i === lastIdx);
                lastIdx = i;
                return SPRITES[i];
            }

            function buildCells(sprite) {
                cells = [];
                const offX = Math.floor((W - COLS * CELL) / 2);
                const offY = Math.floor((H - sprite.rows.length * CELL) / 2);
                for (let r = 0; r < sprite.rows.length; r++) {
                    const half = sprite.rows[r];
                    const full = half + half.split('').reverse().join('');
                    for (let c = 0; c < COLS; c++) {
                        const ch = full[c];
                        if (!ch || ch === '.') continue;
                        cells.push({
                            x: offX + c * CELL,
                            y: offY + r * CELL,
                            col: sprite.pal[ch] || '#60E790',
                            ch: GLYPHS[Math.floor(Math.random() * GLYPHS.length)],
                            flick: Math.random() < 0.10,
                            seed: Math.random() * 1000,
                            delay: 600 + Math.random() * 3600,
                            on: false,
                            flashUntil: 0,
                        });
                    }
                }
            }

            function initDrops() {
                drops = [];
                for (let x = 4; x < W; x += 9) {
                    drops.push({ x: x, y: Math.random() * -H, v: 1.4 + Math.random() * 2.6 });
                }
            }

            function drawRain() {
                ctx.font = '10px "JetBrainsMono", monospace';
                for (const d of drops) {
                    d.y += d.v;
                    if (d.y > H + 14) {
                        d.y = -10 - Math.random() * 60;
                        d.v = 1.4 + Math.random() * 2.6;
                    }
                    ctx.fillStyle = 'rgba(72, 200, 120, 0.45)';
                    ctx.fillText(GLYPHS[Math.floor(Math.random() * GLYPHS.length)], d.x, d.y);
                }
            }

            function drawCells(now) {
                ctx.font = 'bold 9px "JetBrainsMono", monospace';
                let allOn = true;
                for (const cell of cells) {
                    if (!cell.on) {
                        if (now - startAt >= cell.delay) {
                            cell.on = true;
                            cell.flashUntil = now + 280;
                        } else {
                            allOn = false;
                            continue;
                        }
                    }
                    let ch = cell.ch;
                    if (cell.flick) {
                        const step = Math.floor(now / 300) + Math.floor(cell.seed);
                        ch = GLYPHS[step % GLYPHS.length];
                    }
                    if (now < cell.flashUntil) {
                        ctx.globalAlpha = 1;
                        ctx.fillStyle = '#F2FFF6';
                    } else {
                        ctx.globalAlpha = 0.72 + 0.28 * Math.sin(now / 420 + cell.seed);
                        ctx.fillStyle = cell.col;
                    }
                    ctx.fillText(ch, cell.x + 2, cell.y + 8);
                }
                ctx.globalAlpha = 1;
                return allOn;
            }

            function loop(now) {
                ctx.fillStyle = 'rgba(5, 9, 5, 0.10)';
                ctx.fillRect(0, 0, W, H);
                drawRain();
                const allOn = drawCells(now);
                if (allOn && !finished) {
                    finished = true;
                    CAPTION.textContent = '> сформировано: ' + currentName.toUpperCase();
                    CAPTION.classList.add('show');
                }
                rafId = requestAnimationFrame(loop);
            }

            function drawStatic(sprite) {
                ctx.fillStyle = '#050905';
                ctx.fillRect(0, 0, W, H);
                const offX = Math.floor((W - COLS * CELL) / 2);
                const offY = Math.floor((H - sprite.rows.length * CELL) / 2);
                ctx.font = 'bold 9px "JetBrainsMono", monospace';
                for (let r = 0; r < sprite.rows.length; r++) {
                    const half = sprite.rows[r];
                    const full = half + half.split('').reverse().join('');
                    for (let c = 0; c < COLS; c++) {
                        const ch = full[c];
                        if (!ch || ch === '.') continue;
                        ctx.fillStyle = sprite.pal[ch] || '#60E790';
                        ctx.fillText(ch, offX + c * CELL + 2, offY + r * CELL + 8);
                    }
                }
                CAPTION.textContent = '> сформировано: ' + currentName.toUpperCase();
                CAPTION.classList.add('show');
            }

            function start() {
                const sprite = pickSprite();
                currentName = sprite.name;
                finished = false;
                CAPTION.classList.remove('show');
                CAPTION.textContent = '> формирование…';
                ctx.fillStyle = '#050905';
                ctx.fillRect(0, 0, W, H);
                buildCells(sprite);
                initDrops();
                startAt = performance.now();
                if (reduceMotion) {
                    drawStatic(sprite);
                    return;
                }
                if (!running) {
                    running = true;
                    rafId = requestAnimationFrame(loop);
                }
            }

            function openPopup() {
                isOpen = true;
                POPUP.classList.add('open');
                POPUP.setAttribute('aria-hidden', 'false');
                BTN.classList.add('mascot-button--open');
                BTN.setAttribute('aria-expanded', 'true');
                start();
            }

            function closePopup() {
                isOpen = false;
                POPUP.classList.remove('open');
                POPUP.setAttribute('aria-hidden', 'true');
                BTN.classList.remove('mascot-button--open');
                BTN.setAttribute('aria-expanded', 'false');
                if (rafId) {
                    cancelAnimationFrame(rafId);
                    rafId = null;
                }
                running = false;
            }

            BTN.addEventListener('click', function () {
                if (!isOpen) {
                    openPopup();
                } else {
                    start();
                }
            });

            CLOSE.addEventListener('click', closePopup);

            document.addEventListener('mousedown', function (e) {
                if (isOpen && !POPUP.contains(e.target) && !BTN.contains(e.target)) {
                    closePopup();
                }
            });

            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape' && isOpen) {
                    closePopup();
                }
            });
        })();
    </script>

    <script>
        // Только UI: переключатель темы (системная / светлая / тёмная).
        // Логика преобразования целиком в script.js и не изменялась.
        (function () {
            const root = document.documentElement;
            const KEY = 'theme';
            const buttons = document.querySelectorAll('.theme-btn[data-theme-choice]');

            const FAV_LIGHT = 'images/favicon-mascot.svg';
            const FAV_DARK = 'images/favicon-mascot-dark.svg';
            const favIcon = document.querySelector('link[rel="icon"][type="image/svg+xml"]');
            const mqDark = window.matchMedia('(prefers-color-scheme: dark)');
            function apply(choice) {
                const darkNow = choice === 'dark' || (choice !== 'light' && mqDark.matches);
                if (choice === 'light' || choice === 'dark') {
                    root.setAttribute('data-theme', choice);
                } else {
                    root.removeAttribute('data-theme');
                }
                if (favIcon) favIcon.href = darkNow ? FAV_DARK : FAV_LIGHT;
                buttons.forEach(b => {
                    const active = b.dataset.themeChoice === choice;
                    b.classList.toggle('theme-btn--active', active);
                    b.setAttribute('aria-pressed', String(active));
                });
            }

            let saved = localStorage.getItem(KEY);
            if (saved !== 'light' && saved !== 'dark' && saved !== 'system') {
                saved = 'system';
            }
            apply(saved);

            mqDark.addEventListener('change', function () {
                const c = localStorage.getItem(KEY) || 'system';
                if (c !== 'light' && c !== 'dark') apply('system');
            });

            buttons.forEach(b => b.addEventListener('click', () => {
                const choice = b.dataset.themeChoice;
                localStorage.setItem(KEY, choice);
                apply(choice);
            }));
        })();

        // Только UI: уведомление об успешном копировании после преобразования.
        // Логика преобразования целиком в script.js и не изменялась.
        (function () {
            const transformButton = document.getElementById('transformButton');
            const toast = document.getElementById('toast');

            transformButton.addEventListener('click', () => {
                toast.classList.add('toast--visible');

                if (toast.timeoutId) {
                    clearTimeout(toast.timeoutId);
                }

                toast.timeoutId = setTimeout(() => {
                    toast.classList.remove('toast--visible');
                }, 2200);
            });
        })();
    </script>

        <script>
        // Только UI: сценарий «Удалить страницу?» — мем, затем интерфейс осыпается песком:
        // сверху вниз, по глубине (параллакс z у каждой песчинки), с плавным ветром.
        // Логика преобразования целиком в script.js и не изменялась.
        (function () {
            const LINK = document.getElementById('nukeLink');
            const POP = document.getElementById('nukePop');
            const YES = document.getElementById('nukeYes');
            const NO = document.getElementById('nukeNo');
            const CAT = document.getElementById('nukeCat');
            const CANVAS = document.getElementById('nukeCanvas');
            const ctx = CANVAS.getContext('2d');

            // Независимые «куски» интерфейса — каждый осыпается отдельно.
            const TARGETS = [
                '.topbar', '.rail-title', '.switch-row',
                '.pane', '.transform-bar', '.statusline',
                '.mascot-button', '.nuke-link', '.oracle-popup'
            ].join(', ');

            let running = false;

            function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

            LINK.addEventListener('click', function (e) {
                e.stopPropagation();
                POP.classList.toggle('open');
            });

            document.addEventListener('mousedown', function (e) {
                if (POP.classList.contains('open') && !POP.contains(e.target) && !LINK.contains(e.target)) {
                    POP.classList.remove('open');
                }
            });

            NO.addEventListener('click', function () { POP.classList.remove('open'); });

            YES.addEventListener('click', async function () {
                if (running) return;
                running = true;
                POP.classList.remove('open');

                // Мем по центру: появился → подержался → медленно растаял
                CAT.classList.add('show');
                await wait(1800);
                CAT.classList.add('fade');
                await wait(1200);
                CAT.classList.remove('show', 'fade');

                try {
                    if (!window.html2canvas) {
                        await fadeEverything();
                        return;
                    }
                    await destroy(TARGETS, false);   // содержимое: сверху вниз
                    await destroy('.frame', true);   // затем пустой каркас, сжато
                } catch (err) {
                    console.error('nuke failed', err);
                    await fadeEverything();
                }
            });

            async function fadeEverything() {
                document.querySelectorAll(TARGETS + ', .frame').forEach(function (el) {
                    el.style.transition = 'opacity 1200ms ease';
                    el.style.opacity = '0';
                    el.style.visibility = 'hidden';
                });
            }

            async function destroy(sel, compressed) {
                window.scrollTo(0, 0);

                // html2canvas не видит содержимое textarea — подменяем его дивами-клонами
                const cleanup = [];

                document.querySelectorAll('textarea').forEach(function (ta) {
                    if (getComputedStyle(ta).visibility === 'hidden') return;
                    const r = ta.getBoundingClientRect();
                    const cs = getComputedStyle(ta);
                    const d = document.createElement('div');
                    d.textContent = ta.value;
                    d.style.cssText = 'position:absolute;z-index:9999;background:transparent;white-space:pre-wrap;overflow:hidden;'
                        + 'left:' + (r.left + window.scrollX) + 'px;top:' + (r.top + window.scrollY) + 'px;'
                        + 'width:' + ta.clientWidth + 'px;height:' + ta.clientHeight + 'px;'
                        + 'font-family:' + cs.fontFamily + ';font-size:' + cs.fontSize + ';font-weight:' + cs.fontWeight + ';'
                        + 'line-height:' + cs.lineHeight + ';padding:' + cs.padding + ';color:' + cs.color + ';';
                    document.body.appendChild(d);
                    cleanup.push(function () { d.remove(); });
                });

                // html2canvas в свежих Chrome спотыкается о computed-стили форм-контролов
                // и inline-SVG — на время снимка подменяем их простыми блоками/картинками.
                document.querySelectorAll('input').forEach(function (inp) {
                    if (getComputedStyle(inp).visibility === 'hidden') return;
                    const r = inp.getBoundingClientRect();
                    if (!r.width || !r.height) return;
                    const cs = getComputedStyle(inp);
                    const knob = Math.max(8, r.height - 4);
                    const holder = document.createElement('div');
                    holder.style.cssText = 'position:absolute;z-index:9999;border-radius:999px;background:' + cs.backgroundColor
                        + ';left:' + (r.left + window.scrollX) + 'px;top:' + (r.top + window.scrollY) + 'px;'
                        + 'width:' + r.width + 'px;height:' + r.height + 'px;';
                    const k = document.createElement('div');
                    k.style.cssText = 'position:absolute;top:2px;left:' + (inp.checked ? (r.width - knob - 2) : 2) + 'px;'
                        + 'width:' + knob + 'px;height:' + knob + 'px;border-radius:50%;background:' + (cs.getPropertyValue('--surface').trim() || '#FFFFFF') + ';';
                    holder.appendChild(k);
                    const prevV = inp.style.visibility;
                    inp.style.visibility = 'hidden';
                    document.body.appendChild(holder);
                    cleanup.push(function () { holder.remove(); inp.style.visibility = prevV; });
                });

                document.querySelectorAll('svg').forEach(function (sv) {
                    const r = sv.getBoundingClientRect();
                    if (!r.width || !r.height) return;
                    try {
                        const clone = sv.cloneNode(true);
                        clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
                        clone.setAttribute('style', 'color:' + getComputedStyle(sv.parentElement).color + ';');
                        const img = document.createElement('img');
                        img.style.cssText = 'position:absolute;z-index:9999;left:' + (r.left + window.scrollX) + 'px;top:' + (r.top + window.scrollY) + 'px;width:' + r.width + 'px;height:' + r.height + 'px;';
                        img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(clone));
                        const prevV = sv.style.visibility;
                        sv.style.visibility = 'hidden';
                        document.body.appendChild(img);
                        cleanup.push(function () { img.remove(); sv.style.visibility = prevV; });
                    } catch (e) { /* не критично для эффекта */ }
                });

                const shot = await html2canvas(document.body, {
                    backgroundColor: null,
                    scale: 1,
                    logging: false
                });
                cleanup.forEach(function (fn) { fn(); });

                // Куски: вырезаем каждый элемент из общего снимка по его прямоугольнику.
                // Порядок осыпания — сверху вниз по странице; крупные «фоновые» куски
                // (большая площадь) начинают чуть раньше мелких виджетов — это и есть глубина.
                const docH = Math.max(document.documentElement.scrollHeight, 1);
                const units = [];
                [...new Set(document.querySelectorAll(sel || TARGETS))].forEach(function (el) {
                    const cs = getComputedStyle(el);
                    if (cs.visibility === 'hidden' || cs.display === 'none') return;
                    const r = el.getBoundingClientRect();
                    const w = Math.round(r.width), h = Math.round(r.height);
                    if (w < 6 || h < 6) return;
                    const c = document.createElement('canvas');
                    c.width = w; c.height = h;
                    c.getContext('2d', { willReadFrequently: true }).drawImage(
                        shot,
                        Math.round(r.left + window.scrollX), Math.round(r.top + window.scrollY), w, h,
                        0, 0, w, h
                    );
                    const area = (r.width * r.height) / (1440 * 300);
                    units.push({
                        el: el,
                        x: r.left, y: r.top, w: w, h: h, c: c,
                        depth: Math.min(1, area),
                        startBase: (compressed ? 250 : 700) + (r.top / docH) * (compressed ? 2600 : 6800) - Math.min(1, area) * 450,
                        sweep: Math.min(compressed ? 1400 : 1900, Math.max(650, h * 4.2)),
                        hidden: false, hideAt: 0
                    });
                });
                units.sort(function (a, b) { return a.startBase - b.startBase; });

                // Песчинки: растр каждого куска режется на квадратики 3×3
                let parts = [];
                const STEP = 3;
                for (const u of units) {
                    const data = u.c.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, u.w, u.h).data;
                    for (let y = 0; y < u.h; y += STEP) {
                        const rowT = y / u.h;
                        for (let x = 0; x < u.w; x += STEP) {
                            const i = (y * u.w + x) * 4;
                            if (data[i + 3] < 24) continue;
                            const z = 0.7 + Math.random() * 0.6; // «глубина» песчинки
                            parts.push({
                                x: u.x + x + Math.random() * 1.4,
                                y: u.y + y + Math.random() * 1.4,
                                s: STEP * (0.7 + z * 0.4),
                                col: 'rgb(' + data[i] + ',' + data[i + 1] + ',' + data[i + 2] + ')',
                                vx: (Math.random() - 0.5) * 16,
                                vy: -10 + Math.random() * 26,
                                gr: 560 * z + Math.random() * 170,
                                drift: (Math.random() - 0.5) * 60,
                                start: u.startBase + rowT * u.sweep + Math.random() * 110,
                                life: (1.2 + Math.random() * 1.15) * (2 - z * 0.55),
                                a: 1,
                                dead: false
                            });
                        }
                    }
                    u.hideAt = u.startBase + u.sweep * 0.7;
                }

                // Прореживание для слабых машин: не больше ~52 тыс. песчинок
                if (parts.length > 52000) {
                    const every = Math.ceil(parts.length / 52000);
                    parts = parts.filter(function (_, i) { return i % every === 0; });
                }

                // Группировка по цвету: меньше переключений fillStyle — плавнее кадр
                parts.sort(function (a, b) { return a.col < b.col ? -1 : a.col > b.col ? 1 : 0; });

                CANVAS.width = window.innerWidth;
                CANVAS.height = window.innerHeight;
                CANVAS.style.display = 'block';

                const t0 = performance.now();
                let lastNow = t0;
                let done = function () {};

                function frame(now) {
                    const k = Math.min(3, (now - lastNow) / 16.7 || 1);
                    lastNow = now;
                    const t = now - t0;
                    const dt = (k * 16.7) / 1000;                 // длительность кадра в секундах
                    const wind = Math.sin(t / 1400) * 9;          // лёгкий качающийся ветер

                    ctx.clearRect(0, 0, CANVAS.width, CANVAS.height);
                    let alive = 0;
                    let lastCol = '';

                    for (let n = 0; n < parts.length; n++) {
                        const p = parts[n];
                        if (p.dead) continue;
                        const lt = t - p.start;
                        if (lt < 0) { alive++; continue; }
                        const lifeT = lt / (p.life * 1000);
                        if (lifeT >= 1 || p.y > CANVAS.height + 20) { p.dead = true; continue; }
                        alive++;

                        p.vy += p.gr * dt;
                        p.vx += ((wind + p.drift) - p.vx) * Math.min(1, dt * 0.9);
                        p.x += p.vx * dt;
                        p.y += p.vy * dt;

                        const fade = 1 - lifeT;
                        ctx.globalAlpha = Math.min(1, fade * 1.5);
                        if (p.col !== lastCol) { ctx.fillStyle = p.col; lastCol = p.col; }
                        const sz = p.s * (0.45 + 0.55 * fade);
                        ctx.fillRect(p.x, p.y, sz, sz);
                    }
                    ctx.globalAlpha = 1;

                    // Реальный элемент тает, когда фронт крошения прошёл по нему
                    for (const u of units) {
                        if (!u.hidden && t >= u.hideAt) {
                            u.hidden = true;
                            u.el.style.transition = 'opacity 320ms ease';
                            u.el.style.opacity = '0';
                            setTimeout(function () { u.el.style.visibility = 'hidden'; }, 340);
                        }
                    }

                    if (alive > 0) requestAnimationFrame(frame);
                    else { CANVAS.style.display = 'none'; done(); }
                }
                return new Promise(function (res) { done = res; requestAnimationFrame(frame); });
            }
        })();
    </script>
